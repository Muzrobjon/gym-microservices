spring:
  application:
    name: gym-crm-service

  profiles:
    active: local

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{X-Transaction-Id}] %-5level %logger{36} --- %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      all: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationWhichShouldBeLongEnough123456789}
  expiration: ${JWT_EXPIRATION:7200000}

security:
  brute-force:
    max-attempts: ${BRUTE_FORCE_MAX_ATTEMPTS:3}
    block-duration-minutes: ${BRUTE_FORCE_BLOCK_DURATION:5}

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      trainer-workload-service:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: COUNT_BASED
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      trainer-workload-service:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

# Feign Configuration
spring.cloud.openfeign:
  circuitbreaker:
    enabled: true

# Feign logging
logging.level.com.epam.gym.client: DEBUG